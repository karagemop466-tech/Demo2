# Temporary helper for this session's branch only. Runs the same chain as pages.yml and
# commits its own log so the run can be diagnosed from the repository. Deleted before merge.
name: Collect once (branch test)
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline smoke test
        run: python instrument-panel/tests_smoke.py
      - name: Collect demo market data
        run: python instrument-panel/tools/kalshi_collect.py 2>&1 | tee /tmp/collect.log; exit ${PIPESTATUS[0]}
      - name: Show what the collector produced
        if: always()
        run: |
          echo "=== data file ==="
          ls -la data/dashboard_instrument.json data/history_instrument 2>&1 || true
          python - <<'PY' || true
          import json
          d=json.load(open('data/dashboard_instrument.json'))
          print('generated_at', d['meta']['generated_at'])
          print('has populations:', 'populations' in d['calibration'])
          print('counts', json.dumps(d['counts']))
          PY
      - name: Validate
        run: python instrument-panel/tools/validate_data.py 2>&1 | tee /tmp/validate.log; exit ${PIPESTATUS[0]}
      - name: Rebuild pages
        run: python instrument-panel/tools/build_dashboard_site.py 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      - name: Link check
        run: python instrument-panel/tools/check_site.py 2>&1 | tee /tmp/links.log; exit ${PIPESTATUS[0]}
      - name: Write the run log
        if: always()
        run: |
          mkdir -p instrument-panel
          { echo "run ${{ github.run_id }} commit ${{ github.sha }}"; echo "--- collect ---"; tail -30 /tmp/collect.log 2>/dev/null; echo "--- validate ---"; tail -20 /tmp/validate.log 2>/dev/null; echo "--- build ---"; tail -40 /tmp/build.log 2>/dev/null; echo "--- links ---"; tail -10 /tmp/links.log 2>/dev/null; } > instrument-panel/last_run.log || true
      - name: Commit results and log
        if: always()
        run: |
          git config user.name "kalshi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data instrument-panel
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "data: Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"
