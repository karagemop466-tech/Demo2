# Temporary helper for this session's branch only: runs the same collection chain
# as pages.yml so the data and generated pages can be reviewed in the pull request.
# Deleted before the PR is merged.
name: Collect once (branch test)
on:
  push:
    branches: ['arena/**']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect demo market data
        env:
          KALSHI_MAX_SERIES: '400'
          KALSHI_WORKERS: '6'
          KALSHI_MIN_INTERVAL: '0.12'
        run: python instrument-panel/tools/kalshi_collect.py
      - name: Validate
        run: python instrument-panel/tools/validate_data.py
      - name: Rebuild pages
        run: python instrument-panel/tools/build_dashboard_site.py
      - name: Link check
        run: python instrument-panel/tools/check_site.py
      - name: Commit results
        run: |
          git config user.name "kalshi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard_instrument.json data/history_instrument instrument-panel/site
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "data: Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
