name: Refresh Kalshi demo data

# Why this runs in Actions: the dashboard is a static GitHub Pages site, so the
# browser cannot be trusted to be the only data path and the authoring sandbox has
# no egress to Kalshi. Actions runners do, so every run produces a *sourced snapshot*
# committed to data/ which the site reads. Every value on the site therefore traces
# back to a request logged in data/snapshot.json -> api_log.

on:
  workflow_dispatch:
    inputs:
      max_runtime:
        description: "Soft wall-clock budget in seconds (default 2100)"
        required: false
        default: "2100"
      volume_markets:
        description: "Markets to pull trade prints for (default 30)"
        required: false
        default: "30"
      book_samples:
        description: "Order-book samples per market (default 12)"
        required: false
        default: "12"
      series_per_topic:
        description: "In-scope series queried per topic, rotating between runs (default 90)"
        required: false
        default: "90"
  schedule:
    # Every 30 minutes (GitHub cron is best-effort and may run late).
    # Cadence is bounded on purpose: each run commits a few MB of data and git keeps
    # every blob, so a 10-minute cadence grew the repo ~750 MB/day (K-1 finding).
    # The live alert page polls the API from the browser between snapshots.
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/collector.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  # One shared key for every job that commits data, so two runs can never
  # push to main at the same time (previously 4 different keys -> push races).
  group: kalshi-data-writers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Check out the ref that triggered the run (main for the schedule, the branch
        # for a manual dispatch), so the collector can be exercised on a branch before
        # it ever runs on main.
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet cryptography

      - name: Collect demo snapshot
        timeout-minutes: 45
        env:
          # A manual run may pass a lighter scope (used to validate this workflow on a
          # branch); scheduled runs on main always take the full sweep below.
          MAX_RUNTIME: ${{ inputs.max_runtime || '2100' }}
          VOLUME_MARKETS: ${{ inputs.volume_markets || '30' }}
          BOOK_SAMPLES: ${{ inputs.book_samples || '12' }}
          SERIES_PER_TOPIC: ${{ inputs.series_per_topic || '90' }}
          # Optional. Without keys the collector still works: every market-data
          # endpoint used here is public. Keys only add portfolio/trading coverage.
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: |
          python tools/collector.py \
            --max-runtime "$MAX_RUNTIME" \
            --volume-markets "$VOLUME_MARKETS" \
            --book-markets 10 \
            --book-samples "$BOOK_SAMPLES" \
            --series-per-topic "${SERIES_PER_TOPIC:-90}"

      - name: Show result summary
        run: |
          python - <<'PY'
          import json
          s = json.load(open("data/snapshot.json"))
          print("generated:", s["generated_at_utc"])
          print("authenticated:", s["authenticated"])
          print("counts:", json.dumps(s["counts"], indent=2))
          print("per-topic:", json.dumps(s["counts"]["per_topic"]))
          print("failed series:", {k: len(v) for k, v in (s.get("failed_series") or {}).items()})
          print("resolutions this run:", s["counts"].get("resolved_this_run"),
                "total in rolling log:", s["counts"].get("resolved_in_scope"))
          bad = [r for r in s["api_log"] if not r["ok"]]
          print(f"api calls logged: {len(s['api_log'])}, failed: {len(bad)}")
          for r in bad[:10]:
              print("  FAIL", r["http_status"], r["url"][:120], r["note"][:120])
          PY

      - name: Fail loudly if no in-scope data (never publish an empty snapshot silently)
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("data/snapshot.json"))
          n = s["counts"]["markets_in_scope"]
          print("markets_in_scope:", n)
          per = s["counts"]["per_topic"]
          print("per_topic:", per)
          empty = [t for t, c in per.items() if c == 0]
          if empty:
              # Not a failure: a topic can legitimately have no open markets on the
              # demo exchange today (Culture did not, verified 2026-11-20). Reported
              # so the number is never silently zero.
              print(f"::notice title=Empty topics::{', '.join(empty)} had no open markets this run")
          if n == 0:
              print("::error::Collector returned zero in-scope markets; keeping previous data.")
              sys.exit(1)
          PY

      - name: Keep the raw snapshot as an artifact (not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-demo-snapshot
          path: |
            data/snapshot.json
            data/snapshot_api_log.json
            data/dashboard_meta.json
            data/top.json
            data/resolutions.json
            data/liquidity.json
          retention-days: 7
          if-no-files-found: warn

      - name: Commit snapshot
        run: |
          set +e
          exec 2>&1
          git config user.name  "kalshi-demo-bot"
          git config user.email "kalshi-demo-bot@users.noreply.github.com"
          # data/snapshot.json IS committed (kept slim by tools/collector.py's publish
          # caps, ~3 MB): tools/analyze.py and tools/execute_strategy.py read it for
          # the trade pipeline. It is also kept as a run artifact below.
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          MSG="data: refresh Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "::notice::data/ sizes at commit time :: $(du -sh data/* 2>/dev/null | tr '\n' ' ' | cut -c1-300)"
          git commit -m "$MSG"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::git commit failed rc=$rc"
            exit 1
          fi
          # Small, frequent commits; several pipelines commit into data/ (F17), so a
          # push can lose the race. No rebase: on rejection, soft-reset onto the new
          # tip and re-commit OUR freshly collected files (pure outputs; newest wins).
          # Every failure surfaces as a ::warning::/::error:: annotation with the real
          # git output (session eeb796d7: run logs are unreachable this session).
          for attempt in 1 2 3 4 5 6; do
            out=$(git push origin "HEAD:${GITHUB_REF_NAME}" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "snapshot pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed rc=$rc :: $(echo "$out" | tail -25 | tr '\n' '|' | cut -c1-3500)"
            git fetch origin "${GITHUB_REF_NAME}" 2>&1 | tail -1
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add data/
            git commit --allow-empty -m "$MSG"
            sleep $((attempt * 5))
          done
          echo "::error::could not push snapshot after 6 attempts"
          exit 1
