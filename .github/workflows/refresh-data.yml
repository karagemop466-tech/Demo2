name: Refresh Kalshi demo data

# Why this runs in Actions: the dashboard is a static GitHub Pages site, so the
# browser cannot be trusted to be the only data path and the authoring sandbox has
# no egress to Kalshi. Actions runners do, so every run produces a *sourced snapshot*
# committed to data/ which the site reads. Every value on the site therefore traces
# back to a request logged in data/snapshot.json -> api_log.

on:
  workflow_dispatch:
  schedule:
    # every 10 minutes (GitHub cron is best-effort and may run late)
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/collector.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: kalshi-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet cryptography

      - name: Collect demo snapshot
        env:
          # Optional. Without keys the collector still works: every market-data
          # endpoint used here is public. Keys only add portfolio/trading coverage.
          KALSHI_DEMO_API_KEY_ID: ${{ secrets.KALSHI_DEMO_API_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: python tools/collector.py

      - name: Show result summary
        run: |
          python - <<'PY'
          import json
          s = json.load(open("data/snapshot.json"))
          print("generated:", s["generated_at_utc"])
          print("authenticated:", s["authenticated"])
          print("counts:", json.dumps(s["counts"], indent=2))
          bad = [r for r in s["api_log"] if not r["ok"]]
          print(f"api calls logged: {len(s['api_log'])}, failed: {len(bad)}")
          for r in bad[:10]:
              print("  FAIL", r["http_status"], r["url"][:120], r["note"][:120])
          PY

      - name: Fail loudly if no in-scope data (never publish an empty snapshot silently)
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("data/snapshot.json"))
          n = s["counts"]["markets_in_scope"]
          print("markets_in_scope:", n)
          if n == 0:
              print("::error::Collector returned zero in-scope markets; keeping previous data.")
              sys.exit(1)
          PY

      - name: Rebuild generated pages from the new snapshot
        # tools/build_site.py embeds snapshot meta (generated_at_utc, counts) in
        # index.html/alerts.html at build time. If pages are not regenerated with
        # each snapshot commit, CI's "Fail if regenerating produced a diff" gate
        # goes red on the next push (observed at 9319862). Rebuild + check here so
        # data and pages always move together and the gate stays green.
        run: |
          python3 tools/build_site.py
          python3 tools/build_content.py
          python3 tools/check.py

      - name: Fail if any data file exceeds the push tripwire
        # GitHub's pre-receive hook rejects any push containing a file over 100 MB.
        # The collector enforces this too (FILE_LIMIT_BYTES); this step is the
        # workflow-level tripwire so the failure names the offending file instead of
        # surfacing as an opaque push rejection (incident documented in tools/collector.py).
        run: |
          oversize=$(find data -type f -size +90M -print)
          if [ -n "$oversize" ]; then
            echo "::error::data file(s) over the 90MB tripwire (GitHub rejects >100MB per file): $oversize"
            ls -lh data/ | head -30
            exit 1
          fi
          echo "tripwire OK: no data file over 90MB"
          ls -lh data/ | head -30

      - name: Commit snapshot
        run: |
          set +e
          exec 2>&1
          git config user.name  "kalshi-demo-bot"
          git config user.email "kalshi-demo-bot@users.noreply.github.com"
          # Stage ONLY the collector's own outputs + the regenerated pages. Other
          # pipelines also write into data/ (dashboard_instrument.json, history_instrument,
          # jumps — F17); a blanket `git add data/` would revert THEIR newer files on the
          # push-retry soft-reset path below. Pure outputs, newest wins, no cross-clobbering.
          git add data/snapshot.json data/topic-*.json data/resolutions.json data/history.json index.html alerts.html pages/
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          MSG="data: refresh Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          echo "::notice::data/ sizes at commit time :: $(du -sh data/* 2>/dev/null | tr '\n' ' ' | cut -c1-300)"
          git commit -m "$MSG"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::git commit failed rc=$rc"
            exit 1
          fi
          # Small, frequent commits; several pipelines commit into data/ (F17), so a
          # push can lose the race. No rebase: on rejection, soft-reset onto the new
          # tip and re-commit OUR freshly collected files (pure outputs; newest wins).
          # Every failure surfaces as a ::warning::/::error:: annotation with the real
          # git output (session eeb796d7: run logs are unreachable this session).
          for attempt in 1 2 3 4 5 6; do
            out=$(git push origin HEAD:main 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "snapshot pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed rc=$rc :: $(echo "$out" | tail -25 | tr '\n' '|' | cut -c1-3500)"
            git fetch origin main 2>&1 | tail -1
            git reset --soft origin/main
            git add data/snapshot.json data/topic-*.json data/resolutions.json data/history.json index.html alerts.html pages/
            git commit --allow-empty -m "$MSG"
            sleep $((attempt * 5))
          done
          echo "::error::could not push snapshot after 6 attempts"
          exit 1
