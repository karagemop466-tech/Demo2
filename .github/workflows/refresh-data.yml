name: Refresh Kalshi demo data snapshot

# Keeps data/*.json in sync with the public Kalshi *demo* Trade API so the
# GitHub Pages site always ships a current, source-linked snapshot.
#
# The harvester uses only unauthenticated endpoints:
#   GET /markets, /events, /series, /search/tags_by_categories,
#   GET /markets/{ticker}/orderbook
# (see scripts/fetch-data.mjs header for the official doc links)
#
# Run diagnostics are posted to the GitHub issue "Kalshi data refresh log" so
# they are readable without downloading workflow log archives.

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes (off the hour to avoid the GitHub cron stampede).
    - cron: '7,37 * * * *'
  push:
    branches: ['**']
    paths:
      - 'scripts/fetch-data.mjs'
      - '.github/workflows/refresh-data.yml'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe Kalshi demo API reachability
        id: probe
        continue-on-error: true
        run: |
          set +e
          {
            echo "probe utc: $(date -u)"
            echo "dns:"
            getent hosts external-api.demo.kalshi.co || echo "  (no A record from runner)"
            echo "http:"
            curl -sS -m 25 -o /tmp/probe-body.json -w '  status=%{http_code} time=%{time_total}s\n' \
              'https://external-api.demo.kalshi.co/trade-api/v2/markets?limit=1'
            echo "  body:"
            head -c 300 /tmp/probe-body.json 2>/dev/null || echo "  (no body)"
            echo
          } 2>&1 | tee /tmp/probe.log

      - name: Fetch Kalshi demo snapshot
        id: fetch
        continue-on-error: true
        run: |
          set +e
          node scripts/fetch-data.mjs 2>&1 | tee /tmp/fetch.log
          echo "exit_code=${PIPESTATUS[0]}" | tee -a /tmp/fetch.log

      - name: Commit refreshed snapshot
        id: commit
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then
            echo "Snapshot unchanged - nothing to commit."
          else
            git commit -m "data: refresh Kalshi demo snapshot" || true
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Pushed snapshot."
                exit 0
              fi
              echo "push attempt ${attempt} failed; retrying"
              sleep 10
            done
            echo "::warning::Could not push the refreshed snapshot after 4 attempts."

      - name: Publish run diagnostics to the tracking issue
        if: always()
        continue-on-error: true
        run: |
          {
            echo "# refresh-data run diagnostics"
            echo
            echo "- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- commit: ${{ github.sha }}"
            echo "- branch: ${{ github.ref_name }}"
            echo "- finished (UTC): $(date -u)"
            echo
            echo "## Connectivity probe"
            cat /tmp/probe.log 2>/dev/null || echo "(not run)"
            echo
            echo "## Snapshot harvest"
            cat /tmp/fetch.log 2>/dev/null || echo "(not run)"
          } > /tmp/diagnostics.md
          {
            echo "<!-- kalshi-refresh-diagnostics -->"
            echo
            cat /tmp/diagnostics.md
          } > /tmp/issue-body.md
          EXISTING=$(gh issue list --state open --limit 100 --json number,title \
            --jq '[.[] | select(.title == "Kalshi data refresh log")] | .[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "${EXISTING}" --body-file /tmp/issue-body.md || true
          else
            gh issue create --title "Kalshi data refresh log" --body-file /tmp/issue-body.md || true
          fi

      - name: Fail if harvest failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Snapshot harvest failed - see the diagnostics issue"
          exit 1

      - name: Configure Pages
        if: steps.fetch.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.fetch.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
