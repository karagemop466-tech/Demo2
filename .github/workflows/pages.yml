name: Deploy GitHub Pages

# Builds and publishes the site from main.
#
#   1. collect  - calls the public (unauthenticated) Kalshi DEMO Trade API from a runner,
#                 which has outbound internet access the dev sandbox does not, and commits
#                 data/dashboard.json plus a rolling 3-day tick history.
#   2. validate - refuses to publish a snapshot that is unsourced, out of range,
#                 unreconciled or older than six hours.
#   3. deploy   - checks every internal link and #anchor, then publishes the repo root.
#
# The site is static. The browser also polls the Kalshi demo API directly for live prices;
# that is allowed by the API's CORS policy (checked on every run and printed on
# instrument-panel/site/verification.html).
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 minutes; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-and-data
  cancel-in-progress: false   # a running collection must finish before the next starts

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline smoke test
        run: python instrument-panel/tests_smoke.py
      - name: Collect demo market data
        run: python instrument-panel/tools/kalshi_collect.py
      - name: Validate the snapshot
        run: python instrument-panel/tools/validate_data.py
      - name: Rebuild the dashboard pages from the new snapshot
        run: python instrument-panel/tools/build_dashboard_site.py
      - name: Rebuild the price-jump page from the collected trade prints and snapshots
        run: python3 tools/build_jumps.py
      - name: Commit the snapshot and pages
        run: |
          set +e
          exec 2>&1
          git config user.name "kalshi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard_instrument.json data/history_instrument data/jumps.json instrument-panel/site jumps
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          MSG="data: Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -m "$MSG"
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::git commit failed rc=$rc"
            exit 1
          fi
          for attempt in 1 2 3 4 5; do
            out=$(git push origin HEAD:main 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "instrument snapshot pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push attempt $attempt failed rc=$rc :: $(echo "$out" | tail -15 | tr '\n' '|' | cut -c1-2000)"
            git fetch origin main 2>&1 | tail -1
            git reset --mixed origin/main
            git add data/dashboard_instrument.json data/history_instrument data/jumps.json instrument-panel/site jumps
            if git diff --cached --quiet; then
              echo "No data changes after reset."
              exit 0
            fi
            git commit -m "$MSG"
            sleep $((attempt * 5))
          done
          echo "::error::could not push instrument snapshot after 5 attempts"
          exit 1
      - name: Keep the collected snapshot as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-instrument-collection
          path: data/dashboard_instrument.json
          retention-days: 7
          if-no-files-found: warn

  # GitHub Pages is configured in legacy branch-deploy mode (main /).
  # Running actions/deploy-pages@v4 here races with GitHub's native
  # pages-build-deployment workflow on main; this job verifies the tree so
  # legacy Pages publishes a clean site without deployment collisions.
  verify:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify internal links (site must not deploy broken)
        run: python3 scripts/check_links.py
      - name: Validate the instrument-panel snapshot
        run: python instrument-panel/tools/validate_data.py
      - name: Check instrument-panel links and anchors
        run: python instrument-panel/tools/check_site.py
      - name: Check root site links, nav, data, secrets and scripts
        run: python3 tools/check.py
