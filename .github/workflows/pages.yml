name: Deploy GitHub Pages

# Builds and publishes the site from main.
#
#   1. collect  - calls the public (unauthenticated) Kalshi DEMO Trade API from a runner,
#                 which has outbound internet access the dev sandbox does not, and commits
#                 data/dashboard.json plus a rolling 3-day tick history.
#   2. validate - refuses to publish a snapshot that is unsourced, out of range,
#                 unreconciled or older than six hours.
#   3. deploy   - checks every internal link and #anchor, then publishes the repo root.
#
# The site is static. The browser also polls the Kalshi demo API directly for live prices;
# that is allowed by the API's CORS policy (checked on every run and printed on
# instrument-panel/site/verification.html).
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 minutes; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-and-data
  cancel-in-progress: false   # a running collection must finish before the next starts

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline smoke test
        run: python instrument-panel/tests_smoke.py
      - name: Collect demo market data
        run: python instrument-panel/tools/kalshi_collect.py
      - name: Validate the snapshot
        run: python instrument-panel/tools/validate_data.py
      - name: Rebuild the dashboard pages from the new snapshot
        run: python instrument-panel/tools/build_dashboard_site.py
      - name: Emit the canonical root snapshot from the instrument artifact
        # The root dashboard (index.html + assets/site.js) loads data/snapshot.json.
        # The instrument-panel collector above already does the bounded collection that
        # works in the demo environment; this deterministic adapter reshapes its output
        # into the canonical root schema instead of re-running the stalling global
        # /markets pagination in tools/collector.py.
        run: python tools/snapshot_from_instrument.py
      - name: Commit the snapshot and pages
        run: |
          git config user.name "kalshi-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard_instrument.json data/history_instrument instrument-panel/site \
                 data/snapshot.json data/topic-gas.json data/topic-elections.json \
                 data/topic-culture.json data/topic-crypto.json data/topic-golf.json \
                 data/resolutions.json data/history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: Kalshi demo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Keep the collected snapshot as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-instrument-collection
          path: data/dashboard_instrument.json
          retention-days: 7
          if-no-files-found: warn

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify internal links (site must not deploy broken)
        run: python3 scripts/check_links.py
      - name: Validate the instrument-panel snapshot
        run: python instrument-panel/tools/validate_data.py
      - name: Check instrument-panel links and anchors
        run: python instrument-panel/tools/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
