name: Verify read-only monitor

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and build monitor subsite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Run monitor unit tests
        run: npm test
      - name: Check monitor links and source rows
        run: npm run check
      - name: Build monitor validation artifact
        run: npm run build
      - name: Verify built monitor artifact
        run: node scripts/check-site.mjs dist
