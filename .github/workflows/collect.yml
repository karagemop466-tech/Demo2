name: Collect Kalshi demo data

# Pulls the public (unauthenticated) Kalshi DEMO Trade API from a GitHub-hosted
# runner, which has outbound internet access, and commits the verified snapshot
# into data/. The site then serves a live browser fetch with this snapshot as a
# labelled fallback.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/collect_kalshi.py"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect-kalshi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect demo market data
        run: python3 tools/collect_kalshi.py --out data
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh Kalshi demo snapshot"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
